name: Arabic Narration Regression

on:
  push:
    branches: [test-new-data]
    paths:
      - 'voice2reel/production_voice.py'
      - 'tests/test_production_voice.py'
      - '.github/workflows/arabic-voice.yml'
  workflow_dispatch:

jobs:
  voice-offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio-script test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/character-lab.txt pytest
      - name: Run speech-only tests without calling any TTS service
        run: PYTHONPATH=. python -m pytest -q tests/test_production_voice.py
