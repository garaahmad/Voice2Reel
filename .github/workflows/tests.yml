name: Training toolkit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.9.8
      - run: uv pip install --system torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install --system -r requirements/voice.txt -r requirements/dev.txt -r requirements/video.txt -r requirements/presenter.txt
      - run: ruff check .
      - run: python scripts/check_data.py
      - run: pytest -q
