[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "voice2reel-training"
version = "0.1.0"
description = "Colab training tools for Arabic reel scripts and voice cloning"
requires-python = ">=3.11,<3.14"
dependencies = ["pydantic==2.11.7", "numpy==2.2.6", "soundfile==0.13.1", "scipy==1.15.3"]

[tool.setuptools.packages.find]
include = ["voice2reel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402"]

